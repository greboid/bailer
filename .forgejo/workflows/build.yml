name: Build

enable-openid-connect: true


on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  test:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/docker-login@master
        with:
          audience: u:1:b4bcb24d-d2d1-43c7-bae9-ae4de46f571d
  container:
    runs-on: alpine
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/docker-build@master
  release:
    if: github.ref_type == 'tag'
    runs-on: alpine
    needs:
      - test
      - container
    steps:
      - uses: actions/toolkit/git-checkout@master
      - uses: actions/toolkit/go-setup@master
      - uses: actions/toolkit/go-build@master
